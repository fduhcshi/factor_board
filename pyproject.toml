[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-dashboard"
version = "0.1.0"
description = "聚宽因子库公式的 AKShare 复现与因子值看板"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "PyYAML>=6",
]

[tool.setuptools]
packages = [
    "factor_dashboard",
    "factor_dashboard.data",
    "factor_dashboard.core",
    "factor_dashboard.report",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
